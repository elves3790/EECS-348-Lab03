<!DOCTYPE html>
<html>
<head>
    <title>Password Validator</title>
</head>
<body>

    <label for="pass1">First Password:</label><br>
    <input type="password" id="pass1"><br><br>

    <label for="pass2">Re-enter Password:</label><br>
    <input type="password" id="pass2"><br><br>

    <button onclick="compareString()">Validate</button>

    <p id="result"></p>

    <script>
    function compareString() {
        let password1 = document.getElementById("pass1").value;
        let password2 = document.getElementById("pass2").value;
        let result = document.getElementById("result");

        if (password1.length < 8) {
            result.textContent = "Error: Password must be at least 8 characters long!";
            result.style.color = "red";
        } else if (password1 !== password2) {
            result.textContent = "Error: Passwords do not match!";
            result.style.color = "red";
        } else {
            result.textContent = "Success: Passwords match!";
            result.style.color = "green";
        }
    }
    </script>

</body>
</html>
